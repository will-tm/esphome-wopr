esphome:
  name: wopr-display
  friendly_name: "WOPR Display"

external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # steadier delivery of the spectrum frames (UDP, 60 a second)

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "WOPR Display Fallback Hotspot"

captive_portal:

# SPI configuration for MAX7219
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

# WOPR Display Component
switch:
  - platform: wopr_display
    name: "WOPR Animation"
    id: wopr_animation
    cs_pin: GPIO5           # Chip select pin for SPI
    num_matrices: 12        # Number of 8x8 LED matrices (1-32)
    brightness: 2           # LED brightness (0-15)
    min_interval_ms: 333    # Minimum animation interval
    max_interval_ms: 1332   # Maximum animation interval

# Optional: Add a sensor to monitor the display state
binary_sensor:
  - platform: template
    name: "WOPR Display Status"
    lambda: |-
      return id(wopr_animation).state;

# Runtime settings exposed to Home Assistant (each one is optional)
number:
  - platform: wopr_display
    brightness:
      name: "WOPR Brightness"
    interval:
      name: "WOPR Interval"
    density:
      name: "WOPR Density"
    defcon:
      name: "WOPR DEFCON"

select:
  - platform: wopr_display
    name: "WOPR Mode"
